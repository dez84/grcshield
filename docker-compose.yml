services:
  db:
    image: postgres:16-alpine
    container_name: grc-shield-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: grc_shield
      POSTGRES_PASSWORD: grc_shield
      POSTGRES_DB: grc_shield
    ports:
      - '5432:5432'
    volumes:
      - grc_shield_pgdata:/var/lib/postgresql/data
      # Schema is applied automatically on first boot of an empty volume.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U grc_shield -d grc_shield']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  grc_shield_pgdata:
